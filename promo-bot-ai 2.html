<script>
const Core = (() => {
  const PLANS = {
    starter:  { id: 'starter',  name: 'Starter',  price: 29,  maxAutomations: 1,  maxDestinations: 3,   minInterval: 30, maxPerRun: 3 },
    pro:      { id: 'pro',      name: 'Pro',      price: 59,  maxAutomations: 5,  maxDestinations: 15,  minInterval: 10, maxPerRun: 5 },
    business: { id: 'business', name: 'Business', price: 129, maxAutomations: 20, maxDestinations: 100, minInterval: 5,  maxPerRun: 10 },
  };
  const MARKETPLACES = [{ id: 'mercadolivre', name: 'Mercado Livre' }, { id: 'shopee', name: 'Shopee' }];
  const NICHES = {
    eletronicos: { name: 'Eletrônicos', q: 'eletrônicos' }, celulares: { name: 'Celulares', q: 'celular smartphone' },
    informatica: { name: 'Informática', q: 'notebook informática' }, casa: { name: 'Casa', q: 'casa utilidades' },
    games: { name: 'Games', q: 'games console' }, moda: { name: 'Moda', q: 'moda roupas' }, beleza: { name: 'Beleza', q: 'beleza perfume' },
    ferramentas: { name: 'Ferramentas', q: 'ferramentas' }, esporte: { name: 'Esporte', q: 'esporte fitness' }, eletrodomesticos: { name: 'Eletrodomésticos', q: 'eletrodomésticos' },
  };
  const INTERVALS = [5, 10, 15, 30, 60];
  const DEFAULT_TEMPLATE = `🔥 *{nome}*\n\n💰 De ~{preco_original}~ por *{preco}*\n🏷️ {desconto} OFF\n🛒 {marketplace}\n\n👉 {link}`;
  const CFG = { pixKey: '079.464.075-30', pixName: 'PROMO BOT AI', pixCity: 'BRASIL', adminHash: '7be48068f434b6f56aa5b395739b2ee5acfa0ee6ab71bc26ee5889addfea054b', trialDays: 7 };

  // ---------- armazenamento local (localStorage) ----------
  const KEY = 'promobot_v1', SKEY = 'promobot_session';
  // armazenamento com plano B: se o visualizador bloquear o localStorage, usa memória (dados duram só com a página aberta)
  const mem = {}; let persistent = true;
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { persistent = false; return k in mem ? mem[k] : null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch { persistent = false; mem[k] = String(v); } },
    del: (k) => { try { localStorage.removeItem(k); } catch { persistent = false; delete mem[k]; } },
  };
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch { persistent = false; }
  const fresh = () => ({ seq: 1, users: [], destinations: [], automations: [], offers: [], logs: [], payments: [] });
  const load = () => { try { return JSON.parse(store.get(KEY)) || fresh(); } catch { return fresh(); } };
  let DB = load();
  const save = () => store.set(KEY, JSON.stringify(DB));
  const nid = () => DB.seq++;
  const now = () => Date.now();
  const err = (m) => { throw new Error(m); };
  const str = (v, n = 200) => (typeof v === 'string' ? v.trim().slice(0, n) : '');

  async function sha256(s) {
    if (globalThis.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'f' + h.toString(16);
  }
  const rnd = () => [...crypto.getRandomValues(new Uint8Array(12))].map((x) => x.toString(16).padStart(2, '0')).join('');

  // ---------- autenticação ----------
  const planOf = (u) => PLANS[u.plan] || PLANS.starter;
  const hasAccess = (u) => (u.plan_status === 'active' && (!u.plan_expires_at || u.plan_expires_at > now())) || (u.plan_status === 'trial' && u.trial_ends_at > now());
  const currentUser = () => { const id = Number(store.get(SKEY)); return DB.users.find((u) => u.id === id) || null; };
  async function register({ name, email, password, plan }) {
    name = str(name, 80); email = str(email, 120).toLowerCase();
    if (!name) err('Informe seu nome.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) err('E-mail inválido.');
    if (String(password || '').length < 8) err('A senha deve ter ao menos 8 caracteres.');
    if (DB.users.some((u) => u.email === email)) err('Este e-mail já está cadastrado neste navegador.');
    const salt = rnd();
    const u = { id: nid(), name, email, salt, pw: await sha256(salt + password), plan: PLANS[plan] ? plan : 'starter', plan_status: 'trial', trial_ends_at: now() + CFG.trialDays * 86400000, plan_expires_at: null, is_admin: false, created_at: now() };
    DB.users.push(u); save(); store.set(SKEY, u.id); return u;
  }
  async function login(email, password) {
    const u = DB.users.find((x) => x.email === str(email, 120).toLowerCase() && !x.is_admin);
    if (!u || u.pw !== await sha256(u.salt + String(password || ''))) err('E-mail ou senha incorretos.');
    store.set(SKEY, u.id); return u;
  }
  async function adminLogin(code) {
    if (!globalThis.crypto?.subtle) err('Abra o arquivo em um navegador moderno (Chrome, Edge, Firefox ou Safari).');

  root.innerHTML = `<div class="app"><aside class="side" id="side"><a class="logo" href="#/"><i>🤖</i>Promo Bot AI</a>
  ${[['overview', '📊 Visão geral'], ['automations', '⚙️ Automações'], ['destinations', '💬 Grupos / Destinos'], ['integrations', '🔑 Integrações'], ['history', '🕘 Histórico'], ['billing', '💳 Assinatura']].map(([v, l]) => `<button class="nav-i" data-view="${v}">${l}</button>`).join('')}
  <div class="foot"><div style="font-weight:600">${esc(u.name)}</div><div class="muted">Plano ${esc(Core.planOf(u).name)} · ${u.plan_status === 'active' ? 'ativo' : u.plan_status === 'trial' ? 'teste' : u.plan_status}</div><button class="btn ghost sm" style="margin-top:10px;width:100%" data-action="logout">Sair</button></div></aside>
  <main class="main"><button class="btn ghost sm menu-btn" data-action="menu" style="margin-bottom:12px">☰ Menu</button><div id="view"></div></main></div>`;
  renderView();
}
function renderView() {
  const u = Core.currentUser(); if (!u || !$('#view')) return;
  document.querySelectorAll('.nav-i').forEach((b) => b.classList.toggle('on', b.dataset.view === S.view));
  $('#view').innerHTML = VIEWS[S.view](u);
}

    <div class="card" style="margin-bottom:18px"><h3 style="margin-bottom:6px">Pagar com Pix — ${brl(opt.price)}</h3><p class="muted small">Favorecido: ${esc(b.pixName)}. Pague pelo app do seu banco e clique em “Já paguei”. A liberação é feita após a confirmação do pagamento.</p>

function openAutoForm(id) {
  const u = Core.currentUser(), dests = Core.destinations(u.id), lim = Core.planOf(u);
  const a = id ? Core.automations(u.id).find((x) => x.id === id) : { name: '', marketplaces: [], niches: [], keywords: [], interval_min: Math.max(30, lim.minInterval), max_per_run: 3, min_discount: 0, template: Core.DEFAULT_TEMPLATE, destination_ids: [] };
  $('#modalBody').innerHTML = `<div class="head"><h2>${id ? 'Editar' : 'Nova'} automação</h2><button class="btn ghost sm" data-action="close">✕</button></div>
  <form id="af"><label>Nome</label><input name="name" value="${esc(a.name)}" maxlength="80" placeholder="Ex.: Ofertas Tech" required>
  <label>Marketplaces</label><div class="chips">${Core.MARKETPLACES.map((m) => `<label><input type="checkbox" name="marketplaces" value="${m.id}" ${a.marketplaces.includes(m.id) ? 'checked' : ''}><span>${m.name}</span></label>`).join('')}</div>
  <label>Nicho / classificação</label><div class="chips">${Object.entries(Core.NICHES).map(([k, n]) => `<label><input type="checkbox" name="niches" value="${k}" ${a.niches.includes(k) ? 'checked' : ''}><span>${n.name}</span></label>`).join('')}</div>
  <label>Palavras-chave (separadas por vírgula)</label><input name="keywords" value="${esc(a.keywords.join(', '))}" placeholder="ex.: ssd 1tb, monitor gamer">
  <div class="two"><div><label>Intervalo de envio</label><select name="interval_min">${Core.INTERVALS.map((i) => `<option value="${i}" ${a.interval_min === i ? 'selected' : ''} ${i < lim.minInterval ? 'disabled' : ''}>A cada ${i} min${i < lim.minInterval ? ' (plano superior)' : ''}</option>`).join('')}</select></div>
  <div><label>Máx. de ofertas por envio (até ${lim.maxPerRun})</label><input name="max_per_run" type="number" min="1" max="${lim.maxPerRun}" value="${a.max_per_run}"></div></div>
  <label>Desconto mínimo (%) — 0 para não filtrar</label><input name="min_discount" type="number" min="0" max="90" value="${a.min_discount}">
  <label>Enviar para (destinos autorizados)</label>${dests.length ? `<div class="chips">${dests.map((d) => `<label><input type="checkbox" name="destination_ids" value="${d.id}" ${a.destination_ids.includes(d.id) ? 'checked' : ''}><span>${esc(d.name)}</span></label>`).join('')}</div>` : '<div class="banner row" style="justify-content:space-between"><span>Cadastre um destino primeiro.</span><button type="button" class="btn sm" data-action="goto-dest">Cadastrar destino</button></div>'}
  <label>Modelo da mensagem</label><div class="row" style="margin-bottom:8px">${['nome', 'preco', 'preco_original', 'desconto', 'marketplace', 'link'].map((v) => `<span class="var" data-var="{${v}}">{${v}}</span>`).join('')}<span class="muted small">clique para inserir</span></div>
  <div class="two"><textarea name="template" id="tpl">${esc(a.template)}</textarea><div class="preview" id="pv"></div></div>
  <p class="muted small">Linhas com variável vazia são omitidas. O modelo deve conter {link}. Use *negrito*, _itálico_ e ~riscado~ do WhatsApp.</p>
  <div class="row" style="margin-top:14px"><button class="btn">Salvar automação</button><button type="button" class="btn ghost" data-action="close">Cancelar</button></div></form>`;
  $('#modal').classList.add('open');
  const upd = () => { $('#pv').textContent = Core.render($('#tpl').value || Core.DEFAULT_TEMPLATE, Core.sample); };
  $('#tpl').addEventListener('input', upd); upd();
  $('#af').addEventListener('submit', guard(async (e) => { e.preventDefault(); const f = e.target, g = (n) => [...f.querySelectorAll(`[name=${n}]:checked`)].map((i) => i.value);
    Core.saveAutomation(Core.currentUser(), id || null, { name: f.name.value, marketplaces: g('marketplaces'), niches: g('niches'), keywords: f.keywords.value.split(',').map((s) => s.trim()).filter(Boolean), interval_min: Number(f.interval_min.value), max_per_run: Number(f.max_per_run.value), min_discount: Number(f.min_discount.value), destination_ids: g('destination_ids'), template: f.template.value });
    closeModal(); toast('Automação salva.'); renderView(); }));
}

// ---------- admin ----------
let adminQ = '';
function adminPage() {
  const o = Core.adminOverview(), users = Core.adminUsers(adminQ), pays = Core.adminPayments(), pend = pays.filter((p) => p.status === 'pending').length;
  const st = (u) => u.plan_status === 'active' ? '<span class="badge b-ok">Ativo</span>' : u.plan_status === 'canceled' ? '<span class="badge b-err">Cancelado</span>' : (u.trial_ends_at > Date.now() ? '<span class="badge b-warn">Teste</span>' : '<span class="badge b-err">Teste expirado</span>');

  <div class="stats"><div class="card stat"><b>${o.users}</b><span>Usuários</span></div><div class="card stat"><b>${o.active}</b><span>Assinaturas ativas</span></div><div class="card stat"><b>${brl(o.mrr)}</b><span>Receita mensal (MRR)</span></div><div class="card stat"><b>${o.trial}</b><span>Em teste</span></div></div>

  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>Usuários</h3><input id="q" placeholder="Buscar nome ou e-mail" value="${esc(adminQ)}" style="max-width:280px"></div>${users.length ? `<div style="overflow:auto"><table><tr><th>Usuário</th><th>Plano</th><th>Status</th><th>Automações</th><th></th></tr>${users.map((u) => `<tr data-id="${u.id}"><td>${esc(u.name)}<div class="muted small">${esc(u.email)}</div></td>
  <td><select data-f="plan" style="width:auto;padding:6px">${['starter', 'pro', 'business'].map((p) => `<option ${u.plan === p ? 'selected' : ''}>${p}</option>`).join('')}</select></td><td>${st(u)}<div><select data-f="status" style="width:auto;padding:6px;margin-top:6px">${[['active', 'Ativo'], ['trial', 'Teste'], ['canceled', 'Cancelado']].map(([v, l]) => `<option value="${v}" ${u.plan_status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div></td>
  <td>${u.active_automations}/${u.automations}</td><td style="white-space:nowrap"><button class="btn sm" data-save>Salvar</button> <button class="btn ghost sm" data-trial>+7d teste</button> <button class="btn danger sm" data-udel>Excluir</button></td></tr>`).join('')}</table></div>` : '<div class="empty">Nenhum usuário.</div>'}</div></main>`;
  const q = $('#q'); let tm; q.addEventListener('input', (e) => { clearTimeout(tm); tm = setTimeout(() => { adminQ = e.target.value; adminPage(); $('#q').focus(); $('#q').setSelectionRange(adminQ.length, adminQ.length); }, 300); });

// ---------- eventos ----------
document.addEventListener('click', guard(async (e) => {
  const t0 = e.target;
  if (t0.dataset.var) { const t = $('#tpl'); t.setRangeText(t0.dataset.var, t.selectionStart, t.selectionEnd, 'end'); t.focus(); t.dispatchEvent(new Event('input')); return; }
  const pr = t0.closest('tr[data-pay]');
  if (pr) { const act = t0.dataset.approve !== undefined ? 'approve' : t0.dataset.reject !== undefined ? 'reject' : null; if (act && (act === 'reject' || confirm('Confirmar que o Pix caiu na conta e liberar o plano por 30 dias?'))) { Core.adminDecide(Number(pr.dataset.pay), act); toast(act === 'approve' ? 'Plano liberado por 30 dias.' : 'Pagamento recusado.'); adminPage(); } return; }
  const ur = t0.closest('tr[data-id]');
  if (ur) { const id = Number(ur.dataset.id);
    if (t0.dataset.save !== undefined) { Core.adminUpdate(id, { plan: ur.querySelector('[data-f=plan]').value, status: ur.querySelector('[data-f=status]').value }); toast('Usuário atualizado.'); adminPage(); }
    if (t0.dataset.trial !== undefined) { Core.adminUpdate(id, { status: 'trial', extend_trial_days: 7 }); toast('Teste estendido em 7 dias.'); adminPage(); }
    if (t0.dataset.udel !== undefined && confirm('Excluir este usuário e todos os dados dele?')) { Core.adminDelete(id); toast('Usuário excluído.'); adminPage(); } return; }
  const t = t0.closest('button,[data-view]'); if (!t) return; const d = t.dataset, u = Core.currentUser();
  if (d.view) { S.view = d.view; $('#side')?.classList.remove('open'); return renderView(); }
  if (d.action === 'logout') { Core.logout(); go('/'); }
  if (d.action === 'admin-out') { Core.logout(); go('/admin-login'); }
  if (d.action === 'menu') $('#side').classList.toggle('open');
  if (d.action === 'close') closeModal();
  if (d.action === 'new-auto') { S.view = 'automations'; renderView(); openAutoForm(); }
  if (d.action === 'goto-dest') { closeModal(); S.view = 'destinations'; renderView(); }
  if (d.action === 'export') { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Core.exportData()], { type: 'application/json' })); a.download = 'promobot-backup.json'; a.click(); }
  if (d.action === 'reset' && confirm('Apagar TODOS os dados deste navegador (contas, automações, histórico)?')) { Core.reset(); go('/'); toast('Dados apagados.'); }
  if (d.edit) openAutoForm(Number(d.edit));
  if (d.del && confirm('Excluir esta automação e seu histórico?')) { Core.deleteAutomation(u, Number(d.del)); toast('Automação excluída.'); renderView(); }
  if (d.run) { const r = Core.runAutomation(Number(d.run), true); toast(r.paused ? 'Assinatura inativa.' : `Execução concluída: ${r.found ?? 0} encontradas, ${r.sent ?? 0} preparadas.`); renderView(); }
  if (d.deldest && confirm('Remover destino?')) { Core.deleteDestination(u, Number(d.deldest)); renderView(); }
  if (d.tab) { S.histTab = d.tab; renderView(); }
  if (d.copy) { const el = document.getElementById(d.copy); (await copyText(el.value)) ? toast('Copiado!') : (el.select(), toast('Selecionado: use Copiar do seu aparelho.', true)); }
  if (d.copymsg) { const o = Core.offersOf(u).find((x) => x.id === Number(d.copymsg)); (await copyText(o.message)) ? toast('Mensagem copiada!') : toast('Não foi possível copiar.', true); }
  if (d.claim) { Core.claimPayment(u, d.claim); toast('Aviso enviado. Aguarde a confirmação do pagamento.'); renderView(); }
}));
document.addEventListener('change', guard(async (e) => {
  const u = Core.currentUser();
  if (e.target.dataset.toggle) { try { const on = Core.toggle(u, Number(e.target.dataset.toggle)); toast(on ? 'Automação ativada.' : 'Automação pausada.'); } catch (x) { e.target.checked = !e.target.checked; throw x; } renderView(); }
  if (e.target.id === 'lvl') { S.histLevel = e.target.value; renderView(); }
  if (e.target.name === 'bp') { S.billPlan = e.target.value; renderView(); }
}));
document.addEventListener('submit', guard(async (e) => {
  const f = e.target, u = Core.currentUser();
  if (f.id === 'df') { e.preventDefault(); Core.addDestination(u, { name: f.name.value, type: f.type.value, target: f.target.value, authorized: f.authorized.checked }); toast('Destino adicionado.'); renderView(); }
}));
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });

// agendador: roda enquanto a aba estiver aberta
setInterval(() => { if (Core.tick() && S.view && $('#view') && !$('#modal').classList.contains('open')) renderView(); }, 15000);
route();
if (location.hash.slice(1) && !location.hash.slice(1).startsWith('/')) scrollToId(location.hash.slice(1));

</script></body></html>
